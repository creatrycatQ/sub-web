name: 部署至 GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 构建静态资源
        run: node node_modules/@vue/cli-service/bin/vue-cli-service.js build

      - name: 打包 GitHub Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
